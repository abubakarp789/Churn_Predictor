<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} | Churn Predictor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-2xl font-bold text-indigo-600 tracking-tight hover:text-indigo-800 transition-colors">
        <span class="inline-flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 1.343-3 3v1H8a4 4 0 110-8h1.172a4 4 0 013.656 2.344M15 12h1a4 4 0 110 8h-1.172a4 4 0 01-3.656-2.344"/></svg>
          Churn Predictor
        </span>
      </a>
      <nav class="space-x-6">
        <a href="/" class="text-gray-600 hover:text-indigo-600 font-medium transition-colors">Home</a>
        <a href="/prediction" class="text-gray-600 hover:text-indigo-600 font-medium transition-colors">Prediction</a>
        <a href="/analysis" class="text-gray-600 hover:text-indigo-600 font-medium transition-colors">Analysis</a>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-grow">
    <div class="max-w-7xl mx-auto px-6 py-10">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-700 text-white py-6 mt-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
      <p class="text-sm">&copy; {{ now.year }} Churn Predictor. All rights reserved.</p>
      <div class="space-x-4">
        <a href="#" class="hover:text-indigo-200">Privacy Policy</a>
        <a href="#" class="hover:text-indigo-200">Terms</a>
      </div>
    </div>
  </footer>

</body>
</html>
