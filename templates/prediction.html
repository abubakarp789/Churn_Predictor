{% extends 'base.html' %}

{% block title %}Prediction{% endblock %}

{% block content %}
<section class="bg-gradient-to-br from-blue-50 to-indigo-100 rounded-xl shadow-lg p-10">
    <div class="text-center mb-12">
        <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Churn Prediction</h1>
        <p class="text-lg text-gray-600 max-w-3xl mx-auto">Enter the customer's details to get a churn prediction.</p>
    </div>

    <div class="bg-white rounded-lg p-8 shadow-xl">
        <form id="predictionForm" action="/prediction" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
                    <input type="number" id="age" name="age" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter age" required>
                </div>
                <div>
                    <label for="last_login" class="block text-sm font-medium text-gray-700">Days Since Last Login</label>
                    <input type="number" id="last_login" name="last_login" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Days since last login" required>
                </div>
                <div>
                    <label for="avg_time_spent" class="block text-sm font-medium text-gray-700">Average Time Spent (minutes)</label>
                    <input type="number" id="avg_time_spent" name="avg_time_spent" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Average time spent" required>
                </div>
                <div>
                    <label for="avg_transaction_value" class="block text-sm font-medium text-gray-700">Average Transaction Value ($)</label>
                    <input type="number" step="0.01" id="avg_transaction_value" name="avg_transaction_value" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Average transaction value" required>
                </div>
                <div>
                    <label for="points_in_wallet" class="block text-sm font-medium text-gray-700">Points in Wallet</label>
                    <input type="number" id="points_in_wallet" name="points_in_wallet" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Points in wallet" required>
                </div>
                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700">Joining Date</label>
                    <input type="date" id="date" name="date" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="time" class="block text-sm font-medium text-gray-700">Last Visit Time</label>
                    <input type="time" id="time" name="time" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required step="1">
                </div>
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                    <select id="gender" name="gender" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Gender --</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
                <div>
                    <label for="region_category" class="block text-sm font-medium text-gray-700">Region Category</label>
                    <select id="region_category" name="region_category" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Region Category --</option>
                        <option value="Town">Town</option>
                        <option value="City">City</option>
                        <option value="Village">Village</option>
                    </select>
                </div>
                <div>
                    <label for="membership_category" class="block text-sm font-medium text-gray-700">Membership Category</label>
                    <select id="membership_category" name="membership_category" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Membership Category --</option>
                        <option value="Basic Membership">Basic Membership</option>
                        <option value="No Membership">No Membership</option>
                        <option value="Gold Membership">Gold Membership</option>
                        <option value="Platinum Membership">Platinum Membership</option>
                        <option value="Silver Membership">Silver Membership</option>
                        <option value="Premium Membership">Premium Membership</option>
                    </select>
                </div>
                <div>
                    <label for="joined_through_referral" class="block text-sm font-medium text-gray-700">Joined Through Referral</label>
                    <select id="joined_through_referral" name="joined_through_referral" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Referral Option --</option>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div>
                    <label for="preferred_offer_types" class="block text-sm font-medium text-gray-700">Preferred Offer Types</label>
                    <select id="preferred_offer_types" name="preferred_offer_types" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Offer Type --</option>
                        <option value="Gift Vouchers/Coupons">Gift Vouchers/Coupons</option>
                        <option value="Credit/Debit Card Offers">Credit/Debit Card Offers</option>
                        <option value="Without Offers">Without Offers</option>
                    </select>
                </div>
                <div>
                    <label for="medium_of_operation" class="block text-sm font-medium text-gray-700">Medium of Operation</label>
                    <select id="medium_of_operation" name="medium_of_operation" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Medium of Operation --</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Smartphone">Smartphone</option>
                        <option value="Both">Both</option>
                    </select>
                </div>
                <div>
                    <label for="internet_option" class="block text-sm font-medium text-gray-700">Internet Option</label>
                    <select id="internet_option" name="internet_option" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Internet Option --</option>
                        <option value="Wi-Fi">Wi-Fi</option>
                        <option value="Mobile_Data">Mobile Data</option>
                        <option value="Fiber_Optic">Fiber Optic</option>
                    </select>
                </div>
                <div>
                    <label for="used_special_discount" class="block text-sm font-medium text-gray-700">Used Special Discount</label>
                    <select id="used_special_discount" name="used_special_discount" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Option --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div>
                    <label for="offer_application_preference" class="block text-sm font-medium text-gray-700">Offer Application Preference</label>
                    <select id="offer_application_preference" name="offer_application_preference" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Option --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div>
                    <label for="past_complaint" class="block text-sm font-medium text-gray-700">Past Complaint</label>
                    <select id="past_complaint" name="past_complaint" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Option --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div>
                    <label for="feedback" class="block text-sm font-medium text-gray-700">Feedback</label>
                    <select id="feedback" name="feedback" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                        <option value="" selected disabled>-- Select Feedback --</option>
                        <option value="Poor Product Quality">Poor Product Quality</option>
                        <option value="No reason specified">No reason specified</option>
                        <option value="Too many ads">Too many ads</option>
                        <option value="Poor Website">Poor Website</option>
                        <option value="Poor Customer Service">Poor Customer Service</option>
                        <option value="Reasonable Price">Reasonable Price</option>
                        <option value="User Friendly Website">User Friendly Website</option>
                        <option value="Products always in Stock">Products always in Stock</option>
                        <option value="Quality Customer Care">Quality Customer Care</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end space-x-4 mt-8">
                <button type="submit" class="inline-block bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-3 px-8 rounded-full text-lg shadow hover:shadow-lg transform hover:-translate-y-0.5 transition">Predict Churn</button>
                <button type="button" class="inline-block bg-gray-200 text-gray-700 font-bold py-3 px-8 rounded-full text-lg shadow hover:shadow-lg transform hover:-translate-y-0.5 transition" onclick="clearForm()">Clear</button>
            </div>
        </form>

        {% if prediction_text %}
        <div class="mt-12 text-center">
            <h2 class="text-3xl font-bold text-gray-800">Prediction Result</h2>
            <p class="text-2xl text-blue-600 mt-4">{{ prediction_text }}</p>
        </div>
        {% endif %}
    </div>
</section>

<script>
    function clearForm() {
        document.getElementById("predictionForm").reset();
    }
</script>
{% endblock %}
